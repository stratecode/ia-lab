---
- name: Deploy secretary voice and response style
  hosts: all
  become: true
  vars:
    lab_secretary_voice_enabled: true
  roles:
    - lab_speech
  tasks:
    - name: Install shared secretary instructions
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../skills/secretary-core/instructions.md"
        dest: /etc/lab-secretary/instructions.md
        owner: root
        group: root
        mode: "0644"
      notify: Restart lab secretary

  handlers:
    - name: Restart lab secretary
      ansible.builtin.systemd:
        name: lab-secretary
        daemon_reload: true
        state: restarted
