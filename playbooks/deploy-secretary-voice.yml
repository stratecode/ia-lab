---
- name: Deploy secretary voice and response style
  hosts: all
  become: true
  vars:
    lab_secretary_transcription_enabled: true
    lab_secretary_voice_enabled: false
  roles:
    - lab_speech
  tasks:
    - name: Deploy secretary runtime with independent transcription setting
      block:
        - name: Install the built secretary binary and retain the previous version
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../dist/lab-secretary-linux-amd64"
            dest: /usr/local/bin/lab-secretary
            owner: root
            group: root
            mode: "0755"
            backup: true
          register: secretary_binary
          notify: Restart lab secretary

        - name: Enable incoming voice transcription without changing output mode
          ansible.builtin.lineinfile:
            path: /etc/lab-secretary/secretary.env
            regexp: '^LAB_SECRETARY_TRANSCRIPTION_ENABLED='
            line: LAB_SECRETARY_TRANSCRIPTION_ENABLED=true
            mode: "0600"
            backup: true
          register: secretary_stt_env
          no_log: true
          notify: Restart lab secretary

        - name: Keep spoken replies disabled
          ansible.builtin.lineinfile:
            path: /etc/lab-secretary/secretary.env
            regexp: '^LAB_SECRETARY_VOICE_ENABLED='
            line: LAB_SECRETARY_VOICE_ENABLED=false
            mode: "0600"
            backup: true
          register: secretary_tts_env
          no_log: true
          notify: Restart lab secretary

        - name: Clear Piper endpoint while spoken replies are disabled
          ansible.builtin.lineinfile:
            path: /etc/lab-secretary/secretary.env
            regexp: '^LAB_PIPER_URL='
            line: LAB_PIPER_URL=
            mode: "0600"
            backup: true
          register: secretary_piper_env
          no_log: true
          notify: Restart lab secretary

        - name: Restart the secretary after configuration and binary are installed
          ansible.builtin.meta: flush_handlers

        - name: Verify secretary health after voice input deployment
          ansible.builtin.uri:
            url: http://127.0.0.1:8082/health
            status_code: 200
          register: secretary_health
          until: secretary_health.status == 200
          retries: 15
          delay: 2

      rescue:
        - name: Restore the previous secretary environment if health verification fails
          ansible.builtin.copy:
            src: >-
              {{ secretary_stt_env.backup_file
                 | default(secretary_tts_env.backup_file
                 | default(secretary_piper_env.backup_file | default(''))) }}
            dest: /etc/lab-secretary/secretary.env
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          when: >-
            secretary_stt_env.backup_file is defined or
            secretary_tts_env.backup_file is defined or
            secretary_piper_env.backup_file is defined
          no_log: true

        - name: Restore the previous secretary binary if available
          ansible.builtin.copy:
            src: "{{ secretary_binary.backup_file }}"
            dest: /usr/local/bin/lab-secretary
            remote_src: true
            owner: root
            group: root
            mode: "0755"
          when: secretary_binary.backup_file is defined

        - name: Restart secretary after restoring the previous state
          ansible.builtin.systemd:
            name: lab-secretary
            state: restarted

        - name: Report voice input deployment failure
          ansible.builtin.fail:
            msg: "Secretary voice input deployment failed health verification; previous files were restored when backups were available."

  handlers:
    - name: Restart lab secretary
      ansible.builtin.systemd:
        name: lab-secretary
        daemon_reload: true
        state: restarted
