---
- name: Update only the shared secretary executable
  hosts: all
  become: true
  tasks:
    - name: Deploy secretary binary and verify service health
      block:
        - name: Install the built secretary binary and retain the previous version
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../dist/lab-secretary-linux-amd64"
            dest: /usr/local/bin/lab-secretary
            owner: root
            group: root
            mode: "0755"
            backup: true
          register: secretary_binary

        - name: Restart the secretary service
          ansible.builtin.systemd:
            name: lab-secretary
            state: restarted

        - name: Verify secretary health after restart
          ansible.builtin.uri:
            url: http://127.0.0.1:8082/health
            status_code: 200
          register: secretary_health
          until: secretary_health.status == 200
          retries: 15
          delay: 2

      rescue:
        - name: Restore the previous secretary binary if health verification failed
          ansible.builtin.copy:
            src: "{{ secretary_binary.backup_file }}"
            dest: /usr/local/bin/lab-secretary
            remote_src: true
            owner: root
            group: root
            mode: "0755"
          when: secretary_binary.backup_file is defined

        - name: Restart the restored secretary service
          ansible.builtin.systemd:
            name: lab-secretary
            state: restarted
          when: secretary_binary.backup_file is defined

        - name: Report deployment failure
          ansible.builtin.fail:
            msg: "Secretary deployment failed health verification; rollback was attempted when a previous binary was available."
