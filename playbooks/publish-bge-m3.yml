---
- name: Publish BGE-M3 embeddings in the existing llama.cpp router
  hosts: lab
  become: true
  vars:
    bge_model_path: /srv/ai-lab/llama.cpp/models/bge-m3-Q8_0.gguf
    bge_model_url: https://huggingface.co/gpustack/bge-m3-GGUF/resolve/2d48f1737679ad900d5c26c5aad5410e9c70fdca/bge-m3-Q8_0.gguf
    bge_model_sha256: 950f4a8e5e19477a6d3c26d2f162233c20002c601f75e4b002e3239997821167
    router_unit_path: /etc/systemd/system/llama-cpp-main.service
    router_presets_path: /etc/llama.cpp/models.ini

  tasks:
    - name: Confirm the existing router is running
      ansible.builtin.command: systemctl is-active llama-cpp-main
      changed_when: false

    - name: Read the router unit without exposing its API key
      ansible.builtin.slurp:
        src: "{{ router_unit_path }}"
      register: bge_router_unit
      no_log: true

    - name: Read the existing model presets
      ansible.builtin.slurp:
        src: "{{ router_presets_path }}"
      register: bge_router_presets

    - name: Require the current two-model router layout
      ansible.builtin.assert:
        that:
          - "'--models-preset /etc/llama.cpp/models.ini' in (bge_router_unit.content | b64decode)"
          - "'[main]' in (bge_router_presets.content | b64decode)"
          - "'[qwen-eval]' in (bge_router_presets.content | b64decode)"
        fail_msg: The live router layout differs from the expected main and qwen-eval presets.

    - name: Download the pinned BGE-M3 GGUF and verify its SHA-256
      ansible.builtin.get_url:
        url: "{{ bge_model_url }}"
        dest: "{{ bge_model_path }}"
        checksum: "sha256:{{ bge_model_sha256 }}"
        owner: llama-cpp
        group: llama-cpp
        mode: "0644"
        timeout: 900
        force: false

    - name: Add the embeddings preset without changing the chat presets
      ansible.builtin.blockinfile:
        path: "{{ router_presets_path }}"
        marker: "; {mark} BGE-M3 managed by publish-bge-m3.yml"
        block: |
          [bge-m3]
          model = {{ bge_model_path }}
          ctx-size = 8192
          threads = 4
          threads-batch = 4
          parallel = 1
          n-gpu-layers = 0
          device = none
          no-kv-offload = true
          cache-ram = 0
          embedding = true
          pooling = cls
          load-on-startup = true
      register: bge_preset

    - name: Permit three loaded models in the router
      ansible.builtin.replace:
        path: "{{ router_unit_path }}"
        regexp: '(--models-max\s+)\d+'
        replace: '\g<1>3'
      register: bge_router_limit
      no_log: true

    - name: Restart the router after changing its model list
      ansible.builtin.systemd:
        name: llama-cpp-main
        state: restarted
        daemon_reload: true
      when: bge_preset.changed or bge_router_limit.changed

    - name: Wait for all three models to appear
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/v1/models
        return_content: true
        status_code: 200
      register: bge_router_models
      retries: 60
      delay: 5
      until: >-
        bge_router_models.status == 200 and
        ['main', 'qwen-eval', 'bge-m3'] | difference(bge_router_models.json.data | map(attribute='id') | list) | length == 0

    - name: Verify BGE-M3 returns a 1024-dimensional embedding
      ansible.builtin.command:
        argv: [python3, -]
        stdin: |
          import json
          import shlex
          import urllib.request
          from pathlib import Path

          unit = Path("{{ router_unit_path }}").read_text()
          command = next(line.split("=", 1)[1] for line in unit.splitlines() if line.startswith("ExecStart="))
          args = shlex.split(command)
          key = args[args.index("--api-key") + 1]
          request = urllib.request.Request(
              "http://127.0.0.1:8080/v1/embeddings",
              data=json.dumps({"model": "bge-m3", "input": "Prueba de embeddings"}).encode(),
              headers={"Content-Type": "application/json", "Authorization": "Bearer " + key},
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              result = json.load(response)
          vector = result["data"][0]["embedding"]
          assert len(vector) == 1024, len(vector)
          print(json.dumps({"model": result["model"], "dimensions": len(vector)}))
      changed_when: false
      register: bge_embedding_probe
      retries: 24
      delay: 5
      until: bge_embedding_probe.rc == 0
      no_log: true

    - name: Report the verified model list and vector size
      ansible.builtin.debug:
        msg:
          models: "{{ bge_router_models.json.data | map(attribute='id') | list }}"
          embedding: "{{ bge_embedding_probe.stdout | from_json }}"
