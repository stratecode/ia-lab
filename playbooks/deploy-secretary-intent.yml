---
- name: Deploy Donna intent-service integration
  hosts: lab
  become: true
  vars:
    secretary_intent_mode: "{{ lookup('env', 'LAB_INTENT_MODE') | default('shadow', true) }}"
  tasks:
    - name: Require a validated intent mode
      ansible.builtin.assert:
        that:
          - secretary_intent_mode in ['shadow', 'enabled']

    - name: Ensure the interpreter is healthy before changing Donna
      ansible.builtin.uri:
        url: http://127.0.0.1:8091/health
        status_code: 200
      when: not ansible_check_mode

    - name: Install tested Donna binary
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../dist/lab-secretary-linux-amd64"
        dest: /usr/local/bin/lab-secretary
        mode: "0755"
      notify: Restart Donna

    - name: Install Donna source-grounded instructions
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../skills/secretary-core/instructions.md"
        dest: /etc/lab-secretary/instructions.md
        mode: "0644"
      notify: Restart Donna

    - name: Set interpreter endpoint
      ansible.builtin.lineinfile:
        path: /etc/lab-secretary/secretary.env
        regexp: '^LAB_INTENT_URL='
        line: LAB_INTENT_URL=http://127.0.0.1:8091
      notify: Restart Donna

    - name: Set interpreter mode
      ansible.builtin.lineinfile:
        path: /etc/lab-secretary/secretary.env
        regexp: '^LAB_INTENT_MODE='
        line: "LAB_INTENT_MODE={{ secretary_intent_mode }}"
      notify: Restart Donna

    - name: Create Donna systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/lab-secretary.service.d
        state: directory
        mode: "0755"

    - name: Load the private interpreter token into Donna
      ansible.builtin.copy:
        dest: /etc/systemd/system/lab-secretary.service.d/intent-service.conf
        mode: "0644"
        content: |
          [Unit]
          After=lab-intent-service.service
          Requires=lab-intent-service.service

          [Service]
          EnvironmentFile=/etc/lab-intent-service/client.env
      notify: Restart Donna

    - name: Apply Donna changes
      ansible.builtin.meta: flush_handlers
      when: not ansible_check_mode

    - name: Verify Donna health
      ansible.builtin.uri:
        url: http://127.0.0.1:8082/health
        status_code: 200
      when: not ansible_check_mode

  handlers:
    - name: Restart Donna
      ansible.builtin.systemd:
        name: lab-secretary
        daemon_reload: true
        state: restarted
      when: not ansible_check_mode
