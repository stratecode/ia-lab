- name: Deploy only the shared secretary response instructions
  hosts: all
  become: true
  tasks:
    - name: Install instructions and verify service health
      block:
        - name: Install the shared instructions and keep the previous version
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../skills/secretary-core/instructions.md"
            dest: /etc/lab-secretary/instructions.md
            owner: root
            group: root
            mode: "0644"
            backup: true
          register: secretary_instructions

        - name: Restart the secretary only when the instructions changed
          ansible.builtin.systemd:
            name: lab-secretary
            state: restarted
          when: secretary_instructions.changed

        - name: Verify secretary health
          ansible.builtin.uri:
            url: http://127.0.0.1:8082/health
            status_code: 200
          register: secretary_health
          until: secretary_health.status == 200
          retries: 15
          delay: 2

      rescue:
        - name: Restore the previous instructions if verification failed
          ansible.builtin.copy:
            src: "{{ secretary_instructions.backup_file }}"
            dest: /etc/lab-secretary/instructions.md
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: secretary_instructions.backup_file is defined

        - name: Restart the restored secretary
          ansible.builtin.systemd:
            name: lab-secretary
            state: restarted
          when: secretary_instructions.backup_file is defined

        - name: Report failure
          ansible.builtin.fail:
            msg: "Instruction deployment failed health verification; rollback was attempted."
