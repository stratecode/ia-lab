---
# Enables only the lab-side relay required by the external Raspberry Pi watchdog.
# Keep lab_watchdog_relay_enabled=false until the Pi IP is reserved and Fran approves.
# Run --check --diff first; apply only after explicit approval.
- name: Configure lab relay for the external watchdog
  hosts: all
  become: true

  vars_files:
    - ../group_vars/vault.yml

  roles:
    - role: monitor
    - role: lab_alerting
