---
- name: Deploy shared secretary and reconnect Telegram
  hosts: all
  become: true
  vars_files:
    - ../group_vars/vault.yml
  vars:
    open_webui_enabled: true
    orchestrator_enabled: false
    codex_gateway_enabled: false
    lab_secretary_enabled: true
    # Telegram voice notes are transcribed locally; replies remain text-only.
    lab_secretary_transcription_enabled: true
    lab_secretary_voice_enabled: false
  roles:
    - lab_speech
    - lab_secretary
    - open_webui
    - observability
