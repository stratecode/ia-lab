---
- name: Deploy shared secretary and reconnect Telegram
  hosts: all
  become: true
  vars_files:
    - ../group_vars/vault.yml
  vars:
    open_webui_enabled: true
    orchestrator_enabled: false
    codex_gateway_enabled: false
    lab_secretary_enabled: true
    # First controlled voice deployment; set false to stop/disable both engines.
    lab_secretary_voice_enabled: true
  roles:
    - lab_speech
    - lab_secretary
    - open_webui
    - observability
