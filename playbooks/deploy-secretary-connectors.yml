---
- name: Deploy secretary OAuth connectors without reconfiguring the lab
  hosts: lab
  become: true
  gather_facts: false
  vars:
    lab_secretary_connectors_file: "{{ lookup('env', 'LAB_SECRETARY_CONNECTORS_FILE') }}"
  tasks:
    - name: Require a local connector file
      ansible.builtin.assert:
        that:
          - lab_secretary_connectors_file | length > 0
          - lookup('ansible.builtin.file', lab_secretary_connectors_file) | from_json is mapping
        fail_msg: Set LAB_SECRETARY_CONNECTORS_FILE to a valid private JSON file.
      no_log: true

    - name: Install private connector environment
      ansible.builtin.copy:
        dest: /etc/lab-secretary/connectors.env
        owner: root
        group: root
        mode: "0600"
        content: "LAB_SECRETARY_CONNECTORS={{ lookup('ansible.builtin.file', lab_secretary_connectors_file) | b64encode }}\n"
      no_log: true
      notify: Restart lab secretary

    - name: Create secretary systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/lab-secretary.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Load connector environment after the base secretary environment
      ansible.builtin.copy:
        dest: /etc/systemd/system/lab-secretary.service.d/connectors.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          EnvironmentFile=/etc/lab-secretary/connectors.env
      notify: Restart lab secretary

    - name: Apply connector environment changes
      ansible.builtin.meta: flush_handlers

    - name: Verify secretary HTTP health
      ansible.builtin.uri:
        url: http://127.0.0.1:8082/health
        status_code: 200
      register: secretary_health
      until: secretary_health.status == 200
      retries: 15
      delay: 2

  handlers:
    - name: Reload systemd and restart lab secretary
      ansible.builtin.systemd:
        name: lab-secretary
        daemon_reload: true
        state: restarted
      listen: Restart lab secretary
