---
- name: Validate and reload LocalAI nginx
  ansible.builtin.shell: |
    set -euo pipefail
    nginx -t
    systemctl reload nginx
  args:
    executable: /bin/bash
  listen: Reload LocalAI nginx

- name: Restart LocalAI container
  ansible.builtin.command:
    argv:
      - docker
      - restart
      - "{{ localai_container_name }}"
  listen: Restart LocalAI
