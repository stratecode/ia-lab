- name: Validate the global debug flag
  ansible.builtin.assert:
    that:
      - lab_debug_enabled_raw in ['true', 'false']
    fail_msg: "LAB_DEBUG_ENABLED must be exactly true or false."

- name: Inspect optional detailed diagnostic services
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --value
      - "{{ item }}"
  loop:
    - lab-native-inference-trace.service
    - lab-flightrecorder.service
  register: debug_trace_units
  changed_when: false
  failed_when: false

- name: Require detailed diagnostic services when debug is enabled
  ansible.builtin.assert:
    that:
      - item.stdout == 'loaded'
    fail_msg: "Debug is enabled but {{ item.item }} is not installed."
  loop: "{{ debug_trace_units.results }}"
  when: lab_debug_enabled | bool

- name: Reconcile detailed diagnostic services with the global debug flag
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    daemon_reload: true
    enabled: "{{ lab_debug_enabled | bool }}"
    state: "{{ 'started' if lab_debug_enabled | bool else 'stopped' }}"
  loop: "{{ debug_trace_units.results }}"
  when: item.stdout == 'loaded'
