---
# Rol lab_alerting: avisos por Telegram, SAI (NUT), exportadores textfile y alertas extra.
# Autocontenido: no edita ficheros de otros roles. Ver docs/monitoring.md para los cambios
# que sí requieren tocar el rol observability.

- name: Check required variables
  ansible.builtin.assert:
    that:
      - (not lab_alerting_enable_alertmanager_telegram) or (lab_alerting_telegram_bot_token | length > 0)
      - (not lab_alerting_enable_alertmanager_telegram) or (lab_alerting_telegram_chat_id is match('^-?[0-9]+$'))
      - (not lab_alerting_enable_ups) or (lab_alerting_nut_password | length > 0)
    fail_msg: >-
      Define LAB_TELEGRAM_BOT_TOKEN y LAB_TELEGRAM_ALLOWED_USERS en el entorno y
      vault_nut_upsmon_password en group_vars/vault.yml.
  no_log: true
  tags: [always]

# ---------------------------------------------------------------- Alertmanager -> Telegram
- name: Alertmanager Telegram
  when: lab_alerting_enable_alertmanager_telegram
  tags: [alertmanager]
  block:
    - name: Install Alertmanager templates directory content
      ansible.builtin.copy:
        src: alertmanager/telegram.tmpl
        dest: "{{ lab_alerting_alertmanager_dir }}/alertmanager_templates/telegram.tmpl"
        owner: root
        group: prometheus
        mode: "0644"
      notify: lab_alerting restart alertmanager

    - name: Install Telegram bot token file
      ansible.builtin.copy:
        content: "{{ lab_alerting_telegram_bot_token }}"
        dest: "{{ lab_alerting_telegram_token_file }}"
        owner: root
        group: prometheus
        mode: "0640"
      no_log: true
      notify: lab_alerting restart alertmanager

    - name: Configure Alertmanager routes and Telegram receivers
      ansible.builtin.template:
        src: alertmanager.yml.j2
        dest: "{{ lab_alerting_alertmanager_dir }}/alertmanager.yml"
        owner: root
        group: prometheus
        mode: "0640"
        validate: amtool check-config %s
      notify: lab_alerting restart alertmanager

- name: Validate watchdog relay requirements
  ansible.builtin.assert:
    that:
      - lab_watchdog_pi_ip is defined
      - lab_watchdog_pi_ip is match('^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})$')
      - lab_alerting_enable_alertmanager_telegram | bool
    fail_msg: >-
      The watchdog relay needs the Pi's reserved IP and the existing Alertmanager
      Telegram receiver enabled.
  when: lab_watchdog_relay_enabled | default(false) | bool
  tags: [watchdog-relay]

- name: Configure chrony for the external watchdog
  when:
    - lab_watchdog_relay_enabled | default(false) | bool
    - lab_watchdog_relay_chrony_enabled | default(false) | bool
  tags: [watchdog-relay, watchdog-chrony]
  block:
    - name: Install chrony for the watchdog Pi time source
      ansible.builtin.apt:
        name: chrony
        state: present

    - name: Allow only the watchdog Pi to query lab time
      ansible.builtin.template:
        src: lab-watchdog-chrony.conf.j2
        dest: /etc/chrony/conf.d/lab-watchdog.conf
        owner: root
        group: root
        mode: "0644"
      notify: lab_alerting restart chrony

    - name: Ensure chrony is running
      ansible.builtin.systemd:
        name: chrony
        state: started
        enabled: true

    - name: Allow NTP from the watchdog Pi when explicitly requested
      community.general.ufw:
        rule: allow
        from_ip: "{{ lab_watchdog_pi_ip }}"
        port: "123"
        proto: udp
      when: lab_watchdog_manage_ufw | default(false) | bool

# ---------------------------------------------------------------- Reglas de Prometheus
- name: Install Prometheus alert rules
  ansible.builtin.copy:
    src: "prometheus-rules/{{ item }}"
    dest: "{{ lab_alerting_promreg_dir }}/{{ item }}"
    mode: "0644"
    validate: promtool check rules %s
  loop:
    - lab-ups-alerts.yml
    - lab-extra-alerts.yml
    - lab-recording-rules.yml
  when: lab_alerting_enable_rules
  notify: lab_alerting restart prometheus
  tags: [rules]

# ---------------------------------------------------------------- SAI (NUT)
- name: UPS monitoring with NUT
  when: lab_alerting_enable_ups
  tags: [ups]
  block:
    - name: Install NUT
      ansible.builtin.apt:
        name: [nut-server, nut-client]
        state: present

    - name: Set NUT mode to standalone
      ansible.builtin.lineinfile:
        path: /etc/nut/nut.conf
        regexp: '^MODE='
        line: MODE=standalone
      notify: lab_alerting restart nut

    - name: Configure UPS driver
      ansible.builtin.template:
        src: ups.conf.j2
        dest: /etc/nut/ups.conf
        owner: root
        group: nut
        mode: "0640"
      notify: lab_alerting restart nut

    - name: Bind upsd to loopback
      ansible.builtin.template:
        src: upsd.conf.j2
        dest: /etc/nut/upsd.conf
        owner: root
        group: nut
        mode: "0640"
      notify: lab_alerting restart nut

    - name: Configure upsd monitoring user
      ansible.builtin.template:
        src: upsd.users.j2
        dest: /etc/nut/upsd.users
        owner: root
        group: nut
        mode: "0640"
      no_log: true
      notify: lab_alerting restart nut

    - name: Configure upsmon to monitor the UPS (orderly shutdown on low battery)
      ansible.builtin.lineinfile:
        path: /etc/nut/upsmon.conf
        regexp: '^MONITOR '
        line: "MONITOR {{ lab_alerting_ups_name }}@localhost 1 upsmon {{ lab_alerting_nut_password }} primary"
        owner: root
        group: nut
        mode: "0640"
      no_log: true
      notify: lab_alerting restart nut

    - name: Enable NUT services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - nut-driver-enumerator
        - "nut-driver@{{ lab_alerting_ups_name }}"
        - nut-server
        - nut-monitor

    - name: Install UPS metrics exporter
      ansible.builtin.copy:
        src: bin/nut-textfile-exporter
        dest: /usr/local/bin/nut-textfile-exporter
        mode: "0755"

    - name: Install UPS metrics exporter units
      ansible.builtin.copy:
        src: "systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - nut-textfile-exporter.service
        - nut-textfile-exporter.timer
      register: lab_alerting_nut_units

# ---------------------------------------------------------------- Exportadores textfile
- name: Docker metrics exporter
  when: lab_alerting_enable_docker_exporter
  tags: [exporters, docker]
  block:
    - name: Install Docker metrics exporter
      ansible.builtin.copy:
        src: bin/docker-textfile-exporter
        dest: /usr/local/bin/docker-textfile-exporter
        mode: "0755"
    - name: Install Docker metrics exporter units
      ansible.builtin.copy:
        src: "systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - docker-textfile-exporter.service
        - docker-textfile-exporter.timer
      register: lab_alerting_docker_units

- name: Certificate expiry exporter
  when: lab_alerting_enable_cert_exporter
  tags: [exporters, certs]
  block:
    - name: Install certificate expiry exporter
      ansible.builtin.copy:
        src: bin/cert-textfile-exporter
        dest: /usr/local/bin/cert-textfile-exporter
        mode: "0755"
    - name: Install certificate expiry exporter units
      ansible.builtin.copy:
        src: "systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - cert-textfile-exporter.service
        - cert-textfile-exporter.timer
      register: lab_alerting_cert_units

- name: Boot state exporter
  when: lab_alerting_enable_boot_exporter | bool
  tags: [exporters, boot]
  block:
    - name: Create persistent boot state directory
      ansible.builtin.file:
        path: /var/lib/lab-alerting/boot-state
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Check whether boot state has been initialized
      ansible.builtin.stat:
        path: /var/lib/lab-alerting/boot-state/initialized
      register: lab_alerting_boot_state_initialized

    - name: Seed a clean marker on first installation
      ansible.builtin.copy:
        content: "initial-install\n"
        dest: /var/lib/lab-alerting/boot-state/clean-shutdown
        owner: root
        group: root
        mode: "0640"
      when: not lab_alerting_boot_state_initialized.stat.exists

    - name: Mark boot state initialization complete
      ansible.builtin.copy:
        content: "1\n"
        dest: /var/lib/lab-alerting/boot-state/initialized
        owner: root
        group: root
        mode: "0640"
      when: not lab_alerting_boot_state_initialized.stat.exists

    - name: Install boot state textfile exporter
      ansible.builtin.copy:
        src: bin/lab-boot-state-exporter
        dest: /usr/local/bin/lab-boot-state-exporter
        owner: root
        group: root
        mode: "0755"

    - name: Install boot state exporter units
      ansible.builtin.copy:
        src: "systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - lab-boot-clean-marker.service
        - lab-boot-state-exporter.service
        - lab-boot-state-exporter.timer
      register: lab_alerting_boot_units

# ---------------------------------------------------------------- Rotación de clave de llama.cpp
- name: Install and schedule llama.cpp key synchronization
  ansible.builtin.import_tasks: llama_key_sync.yml
  when: lab_alerting_enable_llama_key_sync
  tags: [llama-key]

# ---------------------------------------------------------------- systemd
- name: Reload systemd after unit changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: >-
    (lab_alerting_nut_units is changed) or (lab_alerting_docker_units is changed)
    or (lab_alerting_cert_units is changed)
    or (lab_alerting_boot_units is defined and lab_alerting_boot_units is changed)
  tags: [always]

- name: Enable and start timers and path units
  ansible.builtin.systemd:
    name: "{{ item.name }}"
    enabled: true
    state: started
  loop: "{{ lab_alerting_units | select('mapping') | list }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    lab_alerting_units:
      - {name: nut-textfile-exporter.timer, when: "{{ lab_alerting_enable_ups }}"}
      - {name: docker-textfile-exporter.timer, when: "{{ lab_alerting_enable_docker_exporter }}"}
      - {name: cert-textfile-exporter.timer, when: "{{ lab_alerting_enable_cert_exporter }}"}
      - {name: lab-boot-state-exporter.timer, when: "{{ lab_alerting_enable_boot_exporter }}"}
  when:
    - item.when | bool
    # Check mode cannot enable a unit whose file is only predicted to be copied.
    - not (ansible_check_mode and item.name == 'lab-boot-state-exporter.timer')
  tags: [exporters, ups, llama-key]

- name: Enable clean shutdown marker service
  ansible.builtin.systemd:
    name: lab-boot-clean-marker.service
    enabled: true
    state: started
  when:
    - lab_alerting_enable_boot_exporter | bool
    - not ansible_check_mode
  tags: [exporters, boot]

- name: Establish boot state baseline and publish initial metrics
  ansible.builtin.command: /usr/local/bin/lab-boot-state-exporter --collect
  changed_when: false
  when:
    - lab_alerting_enable_boot_exporter | bool
    - not ansible_check_mode
  tags: [exporters, boot]

# ---------------------------------------------------------------- Grafana
- name: Install UPS Grafana dashboard
  ansible.builtin.copy:
    src: grafana/ups.json
    dest: "{{ lab_alerting_grafana_dashboards_dir }}/ups.json"
    mode: "0644"
  when: lab_alerting_enable_grafana_dashboard | bool
  tags: [grafana]
