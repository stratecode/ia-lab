- name: Restart donna Jira actions
  ansible.builtin.systemd:
    name: donna-jira-actions
    daemon_reload: true
    state: restarted
  when: not ansible_check_mode

- name: Restart lab secretary
  ansible.builtin.systemd:
    name: lab-secretary
    daemon_reload: true
    state: restarted
  when: not ansible_check_mode
