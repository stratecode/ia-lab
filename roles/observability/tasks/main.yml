- name: Ensure observability directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /srv/ai-lab/observability
    - /srv/ai-lab/observability/grafana
    - /srv/ai-lab/observability/grafana/provisioning
    - /srv/ai-lab/observability/grafana/provisioning/datasources
    - /srv/ai-lab/observability/grafana/provisioning/dashboards
    - /srv/ai-lab/observability/grafana/dashboards
    - /var/snap/prometheus/current/promreg
    - /var/lib/prometheus/node-exporter
  when: grafana_enabled or alertmanager_enabled

- name: Bind Alertmanager to loopback and disable single-node clustering
  ansible.builtin.copy:
    dest: /etc/default/prometheus-alertmanager
    mode: "0644"
    content: |
      ARGS="--web.listen-address=127.0.0.1:{{ alertmanager_port }} --cluster.listen-address="
  notify: Restart alertmanager
  when: alertmanager_enabled

- name: Configure router-aware Prometheus scrape and alert rules
  ansible.builtin.import_tasks: router_monitoring.yml

- name: Configure Prometheus web external URL
  ansible.builtin.copy:
    dest: /var/snap/prometheus/current/daemon_arguments
    mode: "0644"
    content: |
      ARGS="--web.listen-address=127.0.0.1:9090 --web.external-url=https://{{ observability_domain }}/prometheus/ --web.route-prefix=/prometheus/"
  notify: Restart prometheus
  when: alertmanager_enabled

- name: Provision Grafana datasource
  ansible.builtin.copy:
    dest: /srv/ai-lab/observability/grafana/provisioning/datasources/prometheus.yml
    mode: "0644"
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: https://{{ observability_domain }}/prometheus
          isDefault: true
          editable: false
  when: grafana_enabled

- name: Provision Grafana dashboards provider
  ansible.builtin.copy:
    dest: /srv/ai-lab/observability/grafana/provisioning/dashboards/dashboards.yml
    mode: "0644"
    content: |
      apiVersion: 1
      providers:
        - name: 'lab'
          orgId: 1
          folder: 'Lab'
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards
  when: grafana_enabled

- name: Install Grafana dashboard
  ansible.builtin.copy:
    dest: /srv/ai-lab/observability/grafana/dashboards/lab-overview.json
    mode: "0644"
    content: |
      {
        "annotations": {"list": []},
        "editable": true,
        "graphTooltip": 0,
        "panels": [
          {
            "type": "timeseries",
            "title": "llama.cpp Memory / KV / Queue",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "targets": [
              {"expr": "llama_cpp_memory_usage_percent{instance=\"llama-cpp-main\"}", "legendFormat": "memory %"},
              {"expr": "llama_cpp_kv_cache_usage_percent{instance=\"llama-cpp-main\"}", "legendFormat": "kv cache %"},
              {"expr": "llama_cpp_queue_depth{instance=\"llama-cpp-main\"}", "legendFormat": "queue"}
            ]
          },
          {
            "type": "stat",
            "title": "Service Status",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "targets": [
              {"expr": "up{job=~\"prometheus|llama-cpp-main|node\"}", "legendFormat": "{% raw %}{{job}}{% endraw %}"}
            ]
          },
          {
            "type": "timeseries",
            "title": "CPU Usage %",
            "gridPos": {"h": 8, "w": 8, "x": 0, "y": 32},
            "targets": [
              {"expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\",job=\"node\"}[5m])) * 100)", "legendFormat": "CPU"}
            ]
          },
          {
            "type": "timeseries",
            "title": "Memory Usage %",
            "gridPos": {"h": 8, "w": 8, "x": 8, "y": 32},
            "targets": [
              {"expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100", "legendFormat": "Memory"}
            ]
          },
          {
            "type": "timeseries",
            "title": "Root Filesystem Usage %",
            "gridPos": {"h": 8, "w": 8, "x": 16, "y": 32},
            "targets": [
              {"expr": "100 * (1 - (node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"}))", "legendFormat": "/"}
            ]
          },
          {
            "type": "timeseries",
            "title": "Load Average",
            "gridPos": {"h": 8, "w": 8, "x": 0, "y": 40},
            "targets": [
              {"expr": "node_load1", "legendFormat": "load1"},
              {"expr": "node_load5", "legendFormat": "load5"},
              {"expr": "node_load15", "legendFormat": "load15"}
            ]
          },
          {
            "type": "timeseries",
            "title": "Disk IO Time",
            "gridPos": {"h": 8, "w": 8, "x": 8, "y": 40},
            "targets": [
              {"expr": "rate(node_disk_io_time_seconds_total{device!~\"^(loop|ram|zram|dm-|md).*\"}[5m])", "legendFormat": "{% raw %}{{device}}{% endraw %}"}
            ]
          },
          {
            "type": "timeseries",
            "title": "Temperature C",
            "gridPos": {"h": 8, "w": 8, "x": 16, "y": 40},
            "targets": [
              {"expr": "node_hwmon_temp_celsius", "legendFormat": "{% raw %}{{sensor}}{% endraw %}"}
            ]
          },
          {
            "type": "timeseries",
            "title": "Network Errors",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 48},
            "targets": [
              {"expr": "rate(node_network_receive_errs_total{device!=\"lo\"}[5m])", "legendFormat": "{% raw %}{{device}}{% endraw %} rx"},
              {"expr": "rate(node_network_transmit_errs_total{device!=\"lo\"}[5m])", "legendFormat": "{% raw %}{{device}}{% endraw %} tx"}
            ]
          },
          {
            "type": "stat",
            "title": "Targets Up",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 48},
            "targets": [
              {"expr": "sum(up)", "legendFormat": "up"}
            ]
          }
        ],
        "schemaVersion": 39,
        "style": "dark",
        "tags": ["lab", "baseline"],
        "templating": {"list": []},
        "time": {"from": "now-6h", "to": "now"},
        "timezone": "browser",
        "title": "Lab Baseline",
        "uid": "lab-baseline",
        "version": 1
      }
  when: grafana_enabled

- name: Install LLM latency dashboard
  ansible.builtin.copy:
    src: llm-latency.json
    dest: /srv/ai-lab/observability/grafana/dashboards/llm-latency.json
    mode: "0644"
  when: grafana_enabled

- name: Install Grafana compose file
  ansible.builtin.copy:
    dest: /srv/ai-lab/observability/docker-compose.yml
    mode: "0644"
    content: |
      services:
        grafana:
          image: grafana/grafana-oss:latest
          container_name: grafana
          restart: unless-stopped
          ports:
            - "127.0.0.1:{{ grafana_port }}:3000"
          extra_hosts:
            - "host.docker.internal:host-gateway"
            - "{{ observability_domain }}:host-gateway"
          env_file:
            - /srv/ai-lab/observability/grafana.env
          environment:
            GF_SERVER_DOMAIN: "{{ observability_domain }}"
            GF_SERVER_ROOT_URL: "https://{{ observability_domain }}/"
          volumes:
            - grafana-data:/var/lib/grafana
            - /srv/ai-lab/observability/grafana/provisioning:/etc/grafana/provisioning
            - /srv/ai-lab/observability/grafana/dashboards:/var/lib/grafana/dashboards

      volumes:
        grafana-data:
  when: grafana_enabled

- name: Check existing Grafana environment file
  ansible.builtin.stat:
    path: /srv/ai-lab/observability/grafana.env
  register: observability_grafana_env
  when: grafana_enabled

- name: Require an existing Grafana environment when its vault password is unavailable
  ansible.builtin.assert:
    that:
      - observability_grafana_env.stat.exists
    fail_msg: >-
      Define vault_grafana_admin_password before provisioning Grafana for the
      first time. The existing secret file is preserved when that variable is
      intentionally unavailable.
  when:
    - grafana_enabled
    - vault_grafana_admin_password is not defined

- name: Install Grafana environment file from vault
  ansible.builtin.copy:
    dest: /srv/ai-lab/observability/grafana.env
    mode: "0600"
    content: |
      GF_SECURITY_ADMIN_USER={{ grafana_admin_user }}
      GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}
  when:
    - grafana_enabled
    - vault_grafana_admin_password is defined

- name: Start Grafana stack
  ansible.builtin.command: docker compose up -d
  args:
    chdir: /srv/ai-lab/observability
  register: observability_grafana_compose
  changed_when: >-
    'Created' in observability_grafana_compose.stderr
    or 'Started' in observability_grafana_compose.stderr
    or 'Recreated' in observability_grafana_compose.stderr
  when: grafana_enabled

- name: Enable and start alertmanager
  ansible.builtin.systemd:
    name: prometheus-alertmanager
    state: started
    enabled: true
  when: alertmanager_enabled
