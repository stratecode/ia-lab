---
- name: Bind node-exporter to loopback
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    mode: "0644"
    backup: true
    content: |
      # Managed by Ansible: expose the textfile collector for llama key sync health.
      ARGS="--web.listen-address=127.0.0.1:9100 --collector.textfile.directory=/var/lib/prometheus/node-exporter"
  notify: Restart node-exporter
  when: alertmanager_enabled

- name: Configure Prometheus alert rules
  ansible.builtin.copy:
    dest: /var/snap/prometheus/current/promreg/lab-alerts.yml
    mode: "0644"
    backup: true
    validate: promtool check rules %s
    content: |
      groups:
        - name: lab-host
          rules:
            - alert: NodeDown
              expr: up{job="node"} != 1 or absent(up{job="node"})
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: Node exporter is down
                description: The node exporter target is not responding.

            - alert: HighCPUUsage
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle",job="node"}[5m])) * 100) > 85
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: High CPU usage
                description: CPU usage is above 85% for more than 10 minutes.

            - alert: HostMemoryHigh
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: Host memory usage is high
                description: Memory usage is above 90% for more than 10 minutes.

            - alert: RootFilesystemHighUsage
              expr: 100 * (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"})) > 85
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: Root filesystem usage is high
                description: Root filesystem usage is above 85%.

            - alert: RootFilesystemCritical
              expr: 100 * (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"})) > 95
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: Root filesystem usage is critical
                description: Root filesystem usage is above 95%.

            - alert: HostSwapPressure
              expr: (1 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes)) * 100 > 50
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: Host swap usage is high
                description: More than half of configured swap is in use.

            - alert: HostRecentlyRebooted
              expr: time() - node_boot_time_seconds < 900
              labels:
                severity: critical
              annotations:
                summary: Lab host restarted recently
                description: The host booted less than 15 minutes ago; inspect the previous boot for a crash.

            - alert: DiskIOPressure
              expr: max(rate(node_disk_io_time_seconds_total{device!~"^(loop|ram|zram|dm-|md).*"}[5m])) > 0.6
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: Disk IO pressure
                description: Disk IO time on a physical block device is sustained above 60%.

            - alert: HostTemperatureHigh
              expr: max(node_hwmon_temp_celsius) > 80
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: Host temperature is high
                description: A hardware sensor is reporting above 80C.

            - alert: LlamaCppDown
              expr: up{job="llama-cpp-main"} != 1 or absent(up{job="llama-cpp-main"})
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: llama.cpp principal server is down
                description: Prometheus cannot scrape llama-cpp-main.

            - alert: LlamaCppMemoryHigh
              expr: max(llama_cpp_memory_usage_percent{instance="llama-cpp-main"}) > 90
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: llama.cpp memory usage is high
                description: llama-cpp-main is using more than 90% of its systemd MemoryMax.

            - alert: LlamaCppQueueBacklog
              expr: max(llama_cpp_queue_depth{instance="llama-cpp-main"}) > 2
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: llama.cpp queue backlog detected
                description: llama-cpp-main has more than two pending requests for five minutes.

            - alert: GrafanaDown
              expr: up{job="grafana"} != 1 or absent(up{job="grafana"})
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: Grafana is down
                description: Prometheus cannot scrape Grafana.

            - alert: AlertmanagerDown
              expr: up{job="alertmanager"} != 1 or absent(up{job="alertmanager"})
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: Alertmanager is down
                description: Prometheus cannot scrape Alertmanager.

            - alert: PrometheusConfigurationReloadFailed
              expr: prometheus_config_last_reload_successful != 1
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: Prometheus configuration reload failed
                description: Prometheus rejected its latest configuration or rule reload.
  notify: Restart prometheus
  when: alertmanager_enabled

- name: Configure Prometheus for alertmanager and rules
  ansible.builtin.copy:
    dest: /var/snap/prometheus/current/prometheus.yml
    mode: "0644"
    backup: true
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      alerting:
        alertmanagers:
          - static_configs:
              - targets: ["localhost:{{ alertmanager_port }}"]

      rule_files:
        - /var/snap/prometheus/current/promreg/*.yml

      scrape_configs:
        - job_name: "node"
          honor_labels: true
          static_configs:
            - targets: ["localhost:9100"]

        - job_name: "prometheus"
          metrics_path: /prometheus/metrics
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: "alertmanager"
          static_configs:
            - targets: ["127.0.0.1:{{ alertmanager_port }}"]

        - job_name: "grafana"
          static_configs:
            - targets: ["127.0.0.1:{{ grafana_port }}"]

      {% if llm_telemetry_enabled | default(false) %}
        - job_name: "llm-telemetry"
          static_configs:
            - targets: ["127.0.0.1:{{ llm_telemetry_port }}"]
      {% endif %}

      {% if lab_secretary_enabled | default(false) %}
        - job_name: "lab-secretary"
          metrics_path: /metrics
          static_configs:
            - targets: ["127.0.0.1:{{ lab_secretary_port }}"]
      {% endif %}

        - job_name: "llama-cpp-main"
          metrics_path: /metrics
          params:
            model: [main]
          authorization:
            credentials_file: /var/snap/prometheus/current/llama-api-key
          static_configs:
            - targets: ["127.0.0.1:{{ (llama_cpp_instances | first).port }}"]
              labels:
                instance: "llama-cpp-main"
                alias: "main"

        - job_name: "llama-cpp-qwen-eval"
          metrics_path: /metrics
          params:
            model: [qwen-eval]
          authorization:
            credentials_file: /var/snap/prometheus/current/llama-api-key
          static_configs:
            - targets: ["127.0.0.1:{{ (llama_cpp_instances | first).port }}"]
              labels:
                instance: "llama-cpp-qwen-eval"
                alias: "qwen-eval"
  notify: Restart prometheus
  when: alertmanager_enabled
