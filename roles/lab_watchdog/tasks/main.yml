---
# Applies the watchdog to the Raspberry Pi (inventory group "watchdog", separate inventory file).

- name: Check required variables
  ansible.builtin.assert:
    that:
      - lab_watchdog_lab_mac is match('^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$')
      - (not lab_watchdog_telegram_enabled) or (lab_watchdog_telegram_token | length > 0)
      - (not lab_watchdog_telegram_enabled) or (lab_watchdog_telegram_chat_id is match('^-?[0-9]+$'))
      - lab_watchdog_plug_type in ['none', 'shelly_gen1', 'shelly_gen2', 'tasmota']
      - (lab_watchdog_plug_type == 'none') or (lab_watchdog_plug_host | length > 0)
    fail_msg: >-
      Define lab_watchdog_lab_mac (and, only if the Pi has Internet and telegram is enabled, the token
      vault_lab_watchdog_telegram_token / LAB_WATCHDOG_TELEGRAM_TOKEN and a numeric chat id). See docs/watchdog.md.
  no_log: true
  tags: [always]

# The Pi has no Internet, so nothing is installed with apt: Raspberry Pi OS Lite already ships python3 and ping.
- name: Check that python3 and ping are present (the Pi cannot download them)
  ansible.builtin.shell: "python3 -c 'import sys; assert sys.version_info >= (3, 9)' && command -v ping"
  changed_when: false
  tags: [packages]

- name: Check that pinctrl and the gpio group exist (the indicator cannot download them)
  ansible.builtin.shell: "command -v pinctrl && getent group gpio"
  changed_when: false
  when: lab_watchdog_indicator_enabled | bool
  tags: [packages]

- name: Create the systemd drop-in directories (Raspberry Pi OS does not ship them)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/systemd/timesyncd.conf.d
    - /etc/systemd/system.conf.d
  tags: [packages, hardware]

- name: Take the time from the LAN (no RTC, no Internet; TLS needs the date)
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf.d/10-lab-watchdog.conf
    content: |
      # Managed by Ansible (role lab_watchdog)
      [Time]
      NTP={{ lab_watchdog_ntp_servers | join(' ') }}
      FallbackNTP=
      PollIntervalMaxSec={{ lab_watchdog_ntp_poll_max_seconds }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart timesyncd
  tags: [packages]

- name: Keep the clock right
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  tags: [packages]

- name: Create the service group
  ansible.builtin.group:
    name: "{{ lab_watchdog_group }}"
    system: true

- name: Create the service user (no login, no home)
  ansible.builtin.user:
    name: "{{ lab_watchdog_user }}"
    group: "{{ lab_watchdog_group }}"
    groups: "{{ ['gpio'] if lab_watchdog_indicator_enabled | bool else omit }}"
    append: true
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ lab_watchdog_config_dir }}"
    state: directory
    owner: root
    group: "{{ lab_watchdog_group }}"
    mode: "0750"

- name: Install the watchdog (syntax checked before it replaces the old one)
  ansible.builtin.copy:
    src: lab-watchdog.py
    dest: "{{ lab_watchdog_bin }}"
    owner: root
    group: root
    mode: "0755"
    backup: false
    validate: python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" %s
  notify: Restart lab-watchdog
  tags: [script]

- name: Render the configuration (no secrets in it)
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ lab_watchdog_config_dir }}/config.json"
    owner: root
    group: "{{ lab_watchdog_group }}"
    mode: "0640"
  notify: Restart lab-watchdog
  tags: [config]

- name: Validate the rendered configuration with the installed script
  ansible.builtin.command: "{{ lab_watchdog_bin }} -c {{ lab_watchdog_config_dir }}/config.json check-config"
  changed_when: false
  tags: [config]

- name: Install the Telegram token (only if direct Telegram is enabled)
  ansible.builtin.template:
    src: secrets.env.j2
    dest: "{{ lab_watchdog_config_dir }}/secrets.env"
    owner: root
    group: "{{ lab_watchdog_group }}"
    mode: "0640"
  no_log: true
  notify: Restart lab-watchdog
  when: lab_watchdog_telegram_enabled
  tags: [secrets]

- name: Install the systemd unit
  ansible.builtin.template:
    src: lab-watchdog.service.j2
    dest: /etc/systemd/system/lab-watchdog.service
    owner: root
    group: root
    mode: "0644"
  register: lab_watchdog_unit
  notify: Restart lab-watchdog
  tags: [unit]

- name: Enable the Pi hardware watchdog (the Pi reboots itself if it hangs)
  ansible.builtin.template:
    src: hw-watchdog.conf.j2
    dest: /etc/systemd/system.conf.d/10-lab-watchdog-hw.conf
    owner: root
    group: root
    mode: "0644"
  when: lab_watchdog_enable_hw_watchdog
  notify: Reexecute systemd
  tags: [hardware]

# ---- Pi front panel: power button, status LED (kernel overlays) and early boot beep
- name: Check that the boot configuration file exists
  ansible.builtin.stat:
    path: "{{ lab_watchdog_boot_config_path }}"
  register: lab_watchdog_boot_config
  tags: [panel]

# /boot/firmware is FAT: blockinfile's own backup name (with "@" and "~") is not valid there, so keep the first original.
- name: Keep a copy of the original boot configuration (the first time only)
  ansible.builtin.command:
    cmd: "cp {{ lab_watchdog_boot_config_path }} {{ lab_watchdog_boot_config_path }}.lab-watchdog.bak"
    creates: "{{ lab_watchdog_boot_config_path }}.lab-watchdog.bak"
  when:
    - lab_watchdog_boot_config.stat.exists
    - lab_watchdog_power_button_enabled | bool or lab_watchdog_status_led_enabled | bool
  tags: [panel]

- name: Declare the front-panel overlays in the boot configuration (removed when both are off)
  ansible.builtin.blockinfile:
    path: "{{ lab_watchdog_boot_config_path }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK (role lab_watchdog)"
    insertafter: EOF
    state: "{{ 'present' if (lab_watchdog_power_button_enabled | bool or lab_watchdog_status_led_enabled | bool) else 'absent' }}"
    block: |
      {% if lab_watchdog_power_button_enabled | bool %}
      dtoverlay=gpio-shutdown
      {% endif %}
      {% if lab_watchdog_status_led_enabled | bool %}
      dtoverlay=gpio-led,gpio={{ lab_watchdog_status_led_pin }},label=pi-status,trigger={{ lab_watchdog_status_led_trigger }}
      {% endif %}
  register: lab_watchdog_boot_overlays
  when: lab_watchdog_boot_config.stat.exists
  tags: [panel]

- name: Tell the operator that the Pi needs one reboot for the overlays
  ansible.builtin.debug:
    msg: >-
      The boot configuration changed: reboot the Pi once (sudo reboot) so the power button and the status LED
      overlays take effect. The watchdog restarts by itself after the reboot.
  when: lab_watchdog_boot_overlays is changed
  tags: [panel]

- name: Install the early boot beep unit
  ansible.builtin.template:
    src: lab-watchdog-boot-beep.service.j2
    dest: /etc/systemd/system/lab-watchdog-boot-beep.service
    owner: root
    group: root
    mode: "0644"
  when: lab_watchdog_boot_beep_enabled | bool
  tags: [panel]

- name: Enable the early boot beep unit
  ansible.builtin.systemd:
    name: lab-watchdog-boot-beep
    enabled: true
    daemon_reload: true
  when: lab_watchdog_boot_beep_enabled | bool
  tags: [panel]

- name: Check that the kernel status LED and the "ready" LED do not share a pin
  ansible.builtin.assert:
    that:
      - not (lab_watchdog_status_led_enabled | bool and (lab_watchdog_indicator_pin_ready | string) == (lab_watchdog_status_led_pin | string))
    fail_msg: >-
      The kernel status LED (overlay gpio-led) and the service-driven "ready" LED use the same pin
      ({{ lab_watchdog_status_led_pin }}). Turn lab_watchdog_status_led_enabled off or use another pin.
  tags: [always]

- name: Install the shutdown warning beeps unit
  ansible.builtin.template:
    src: lab-watchdog-shutdown-beep.service.j2
    dest: /etc/systemd/system/lab-watchdog-shutdown-beep.service
    owner: root
    group: root
    mode: "0644"
  when: lab_watchdog_shutdown_beep_enabled | bool
  tags: [panel]

- name: Enable and start the shutdown warning beeps unit (it must be active for ExecStop to run at shutdown)
  ansible.builtin.systemd:
    name: lab-watchdog-shutdown-beep
    enabled: true
    state: started
    daemon_reload: true
  when: lab_watchdog_shutdown_beep_enabled | bool
  tags: [panel]

- name: Disable the shutdown warning beeps unit when it is turned off
  ansible.builtin.systemd:
    name: lab-watchdog-shutdown-beep
    enabled: false
    daemon_reload: true
  failed_when: false  # the unit may never have been installed
  when: not (lab_watchdog_shutdown_beep_enabled | bool)
  tags: [panel]

- name: Remove the shutdown warning beeps unit file when it is turned off
  ansible.builtin.file:
    path: /etc/systemd/system/lab-watchdog-shutdown-beep.service
    state: absent
  when: not (lab_watchdog_shutdown_beep_enabled | bool)
  tags: [panel]

- name: Disable the early boot beep unit when it is turned off
  ansible.builtin.systemd:
    name: lab-watchdog-boot-beep
    enabled: false
    daemon_reload: true
  failed_when: false  # the unit may never have been installed
  when: not (lab_watchdog_boot_beep_enabled | bool)
  tags: [panel]

- name: Remove the early boot beep unit file when it is turned off
  ansible.builtin.file:
    path: /etc/systemd/system/lab-watchdog-boot-beep.service
    state: absent
  when: not (lab_watchdog_boot_beep_enabled | bool)
  tags: [panel]

# ---- persistent system log (so a reboot or shutdown can be diagnosed afterwards)
- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: lab_watchdog_persistent_journal | bool
  tags: [journal]

# Raspberry Pi OS ships its own drop-in with Storage=volatile (to spare the SD card). Drop-ins are read in file-name
# order and the last one wins, so ours must sort after it: 90-, not 10-.
- name: Remove the first version of the journald drop-in (its name sorted before the Raspberry Pi OS one and lost)
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d/10-lab-watchdog.conf
    state: absent
  notify: Restart journald
  tags: [journal]

- name: Keep the system log across reboots (size capped)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/90-lab-watchdog.conf
    content: |
      # Managed by Ansible (role lab_watchdog)
      [Journal]
      Storage=persistent
      SystemMaxUse={{ lab_watchdog_journal_max_use }}
    owner: root
    group: root
    mode: "0644"
  when: lab_watchdog_persistent_journal | bool
  notify:
    - Restart journald
    - Flush the journal to disk
  tags: [journal]

- name: Go back to the volatile system log when persistence is turned off
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d/90-lab-watchdog.conf
    state: absent
  when: not (lab_watchdog_persistent_journal | bool)
  notify: Restart journald
  tags: [journal]

- name: Reload systemd after unit changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: lab_watchdog_unit is changed
  tags: [unit]

- name: Enable and start the watchdog
  ansible.builtin.systemd:
    name: lab-watchdog
    enabled: true
    state: started
  tags: [unit]
