---
- name: Restart lab-watchdog
  ansible.builtin.systemd:
    name: lab-watchdog
    state: restarted
    enabled: true
    daemon_reload: true

- name: Restart timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted

- name: Reexecute systemd
  ansible.builtin.systemd:
    daemon_reexec: true

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Flush the journal to disk
  ansible.builtin.command: journalctl --flush
  changed_when: false
